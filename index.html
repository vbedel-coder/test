<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vivant · Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --ink:#1D2320; --muted:#646B65; --line:#D5D9D2;
  --levain:#356247; --levain-soft:#E1ECE4; --flour:#8A6A2E; --flour-soft:#F3ECDD; --warn:#A8432C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#151916; --surface:#1F2420; --ink:#ECEFEA; --muted:#9BA39C; --line:#323833;
  --levain:#8CC4A0; --levain-soft:#22342A; --flour:#D9B56E; --flour-soft:#332B1D; --warn:#E58A72; }}
:root[data-theme="dark"]{
  --bg:#151916; --surface:#1F2420; --ink:#ECEFEA; --muted:#9BA39C; --line:#323833;
  --levain:#8CC4A0; --levain-soft:#22342A; --flour:#D9B56E; --flour-soft:#332B1D; --warn:#E58A72; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:28px;line-height:1.15;margin:8px 0 2px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.days button{flex:1 0 auto;min-width:56px;padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:20px;margin:28px 0 10px;font-weight:700}
.list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{flex:1;min-width:0}
.row .name b{display:block;font-size:17px}
.row .name small{color:var(--muted);font-size:14px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);
  font:inherit;font-size:26px;font-weight:700;cursor:pointer;line-height:1}
.stepper input{width:56px;height:48px;text-align:center;font:inherit;font-size:24px;font-weight:700;
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row.off .name b{color:var(--muted)}
.add{display:flex;gap:8px;margin-top:10px}
.add select{flex:1;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.add button,.reset{font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.levains{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lv{background:var(--levain-soft);border-radius:16px;padding:14px 16px}
.lv span{display:block;color:var(--levain);font-weight:700;font-size:15px}
.lv strong{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.lv em{font-style:normal;color:var(--muted);font-size:14px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary b{font-size:18px}
details.card summary span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
details.card[open] summary{border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:baseline}
tr:first-child td{border-top:0}
td.q{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;white-space:nowrap}
tr.levain td:first-child{color:var(--levain);font-weight:700}
tr.farine td:first-child{color:var(--flour);font-weight:700}
tr.sub td{padding-left:32px;font-size:15px;color:var(--muted)}
tr.sub td.q{font-size:16px;color:var(--ink)}
tr.grp td{font-weight:700;padding-top:14px}
tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.flours{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.flours td small{color:var(--muted);display:block;font-size:14px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
.note{color:var(--muted);font-size:14px;margin-top:28px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
:focus-visible{outline:3px solid var(--levain);outline-offset:2px}

.tabs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 16px}
.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.prod .qty{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.row .name small.for{color:var(--levain)}
.hint{color:var(--muted);font-size:15px;margin:10px 2px 0}
[hidden]{display:none!important}
.sync{font-size:13px;margin:-8px 0 14px;color:var(--muted)}.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:1px}
.sync.ok::before{background:var(--levain)}.sync.err::before,.sync.local::before{background:var(--warn)}.sync.pending::before{background:var(--flour)}
.nosave{background:var(--flour-soft);color:var(--ink);border:1.5px solid var(--warn);border-radius:12px;padding:12px 14px;margin:4px 0 12px;font-size:15px}
.clients{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.clients button{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.clients button[aria-pressed="true"]{border-color:var(--levain);background:var(--levain-soft);color:var(--levain)}
.clients button.plus{border-style:dashed;color:var(--muted)}
.newc{display:flex;gap:8px;margin-bottom:12px}
.newc input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.newc button{font:inherit;font-weight:700;padding:12px 14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.newc button.ghost,.reset.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.reset.danger{border-color:var(--warn);color:var(--warn)}
.wrapbtn{flex-wrap:wrap;justify-content:flex-start}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.week span{font-weight:700;font-size:16px;text-align:center;flex:1}
.week button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:24px;cursor:pointer}
.days button small{display:block;font-weight:400;font-size:13px;opacity:.8}
.recap td small{display:block;color:var(--muted);font-size:14px}
.prow{border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.prow .row{border-top:0}
.prow.off .name b{color:var(--muted)}
.row.wrow{padding-top:0}
.stepper.small button{width:40px;height:40px;font-size:22px}
.stepper.small input{width:64px;height:40px;font-size:18px}
.stepper .unit{color:var(--muted);font-size:14px;margin-left:2px}
.lvd{display:flex;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--levain) 30%,transparent)}
.lvd div{flex:1}
.lvd em{display:block;color:var(--muted);font-style:normal;font-size:14px}
.lvd b{font-size:20px;font-variant-numeric:tabular-nums}
.lv em.hyd{display:block;margin-top:6px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Production</h1>
  <p class="sub" id="subtitle"></p>
  <p class="sync local" id="sync"></p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabV">Boutique</button>
    <button role="tab" id="tabO">Pro</button>
    <button role="tab" id="tabP">Production</button>
  </div>
  <div class="week" id="week" hidden>
    <button id="wPrev" aria-label="Semaine précédente">‹</button><span id="wLabel"></span><button id="wNext" aria-label="Semaine suivante">›</button>
  </div>
  <div class="days" id="days" role="group" aria-label="Jour"></div>

  <section id="viewV">
    <div class="list" id="sales"></div>
    <p class="hint" id="salesHint"></p>
    <div class="foot"><span class="note" style="margin:0">Ventes du cadencier par défaut.</span>
      <button class="reset" id="resetV">Revenir au cadencier</button></div>
  </section>

  <section id="viewO">
    <div class="clients" id="clients"></div>
    <div class="newc" id="newc" hidden>
      <input id="newName" type="text" placeholder="Nom du client" aria-label="Nom du nouveau client" autocomplete="off">
      <button id="newOk">Créer</button><button id="newCancel" class="ghost">Annuler</button>
    </div>
    <div id="clientBody">
      <div class="list" id="proList"></div>
      <div class="add">
        <select id="proAdd" aria-label="Ajouter un produit à la commande"></select>
        <button id="proAddBtn">Ajouter</button>
      </div>
      <p class="hint" id="proHint"></p>
      <div class="foot wrapbtn">
        <button class="reset" id="saveType">Enregistrer comme commande type</button>
        <button class="reset" id="resetO">Revenir à la commande type</button>
      </div>
      <div class="foot wrapbtn">
        <button class="reset ghost" id="renameC">Renommer</button>
        <button class="reset danger" id="deleteC">Supprimer ce client</button>
      </div>
      <h2>Récap pour facturation</h2>
      <div class="week"><button id="mPrev" aria-label="Mois précédent">‹</button><span id="mLabel"></span><button id="mNext" aria-label="Mois suivant">›</button></div>
      <div id="recap"></div>
      <div class="foot wrapbtn"><button class="reset needdl" id="csvBtn" hidden>Télécharger le récap (tableur)</button></div>
    </div>
  </section>

  <section id="viewP">
    <div class="list" id="prod"></div>
    <div class="add">
      <select id="extra" aria-label="Ajouter une production hors ventes"></select>
      <button id="addBtn">Ajouter</button>
    </div>
    <h2>Levains à préparer</h2>
    <div id="levains"></div>
    <h2>Pesées par pétrissage</h2>
    <div id="pesees"></div>
    <h2>Farines utilisées</h2>
    <div id="flours"></div>
    <div class="foot"><span class="note" style="margin:0">Calculé à partir des ventes. Pour changer une quantité, modifie les ventes.</span>
      <button class="reset" id="resetP">Effacer les ajouts</button></div>
  </section>
  <div class="foot wrapbtn" style="margin-top:32px"><button class="reset ghost needdl" id="exportBtn" hidden>Sauvegarder toutes mes données</button></div>
</div>

// Ordre et ventes boutique par défaut = onglet Cadencier (colonnes Par.)
// rule : J0 = produit le jour de la vente ; J1 = produit la veille ; hebdo = tout le mardi
// Pas de production le lundi ni le samedi : les ventes du samedi sont produites le vendredi,
// et en J1 les ventes du mardi sont produites le mardi.

  ["campagne","J0"],["campagneGraines","J0"],["epeautre","J0"],["riz","J0"],["seigle","J0"],
  ["meteil","J0"],["chataigne","J0"],["rugbrod","J1"],["khorasan","J1"],["blesAnciens","J1"],
  ["fss","J1"],["froment","J1"],["graine","J1"],["focaccia","J1"],["mie","J0"],["brioche","hebdo"]
];
const RULE=Object.fromEntries(P);
const SALE_UNIT={focaccia:"kg"}, SALE_STEP={focaccia:.5};
const TO_PROD={focaccia:v=>v/2.5};   // focaccia : kg vendus ÷ 2,5 = plaques
const SALES0={
  Mar:{campagne:10,campagneGraines:8,epeautre:8,riz:2,blesAnciens:8,fss:8,focaccia:3,mie:8},
  Mer:{epeautre:6,riz:2,blesAnciens:8,fss:8,froment:10,graine:8,focaccia:3,mie:6,brioche:4},

  Ven:{epeautre:6,riz:2,seigle:2,blesAnciens:6,fss:6,froment:12,graine:8,focaccia:3,mie:8,brioche:4},

let stateRef=null,pushTimer=null,syncState="local";
function setSync(st){syncState=st;const el=document.getElementById("sync");if(!el)return;

async function push(){if(!stateRef)return;try{await stateRef.set({v:9,updatedAt:localUpdated,sales,clients,extras});setSync("ok");}
  catch(e){setSync("err");if(e&&e.code==="unavailable"){clearTimeout(pushTimer);pushTimer=setTimeout(push,5000);}}}
function applyRemote(d){if(!d||!d.updatedAt||d.updatedAt<=localUpdated)return false;
  sales=d.sales||{};clients=(d.clients||[]).map(c=>({...c,type:c.type||{},mod:c.mod||{},w:c.w||{}}));extras=d.extras||{};
  if(!clients.find(c=>c.id===cid))cid=clients[0]&&clients[0].id;

async function initSync(){
  if(!window.claude||!window.claude.use){setSync("local");return;}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  const uid=user&&await user.id();
  if(!db||!uid){setSync("local");return;}
  stateRef=db.doc("data/users/"+uid+"/state");setSync("pending");
  try{const snap=await stateRef.get();
    if(snap.exists&&applyRemote(snap.data()))render();
    if(!snap.exists||(snap.data().updatedAt||0)<localUpdated){if(!localUpdated){localUpdated=Date.now();}await push();}else setSync("ok");
  }catch(e){setSync("err");}
  stateRef.onSnapshot(sn=>{if(sn.exists&&!sn.metadata.hasPendingWrites&&applyRemote(sn.data())){render();}if(!sn.metadata.fromCache&&syncState!=="pending")setSync("ok");},()=>setSync("err"));

function stepper(value,label,onSet,step){
  const w=document.createElement("div");w.className="stepper";
  w.innerHTML=`<button aria-label="Moins">−</button><input type="text" inputmode="decimal" value="${num(value)}" aria-label="${label}"><button aria-label="Plus">+</button>`;
  const [m,i,p]=w.children;let cur=value;
  const set=(v,typing)=>{v=Math.max(0,Math.round((+String(v).replace(",",".")||0)*10)/10);cur=v;onSet(v);if(!typing)i.value=num(v);};
  m.onclick=()=>set(cur-step);p.onclick=()=>set(cur+step);
  i.oninput=()=>set(i.value,true);i.onblur=()=>i.value=num(cur);i.onfocus=()=>i.select();
  return w;
}

    const items=[...m.values()],tot=items.reduce((s,i)=>s+i.q,0)+subs.reduce((s,x)=>s+x.items.reduce((a,b)=>a+b.q,0),0);
    const flour=items.filter(i=>i.k==="farine").reduce((s,i)=>s+i.q,0),water=items.filter(i=>/^Eau/.test(i.n)).reduce((s,i)=>s+i.q,0);
    const rows=items.map(i=>`<tr class="${i.k||""}"><td>${i.n}</td><td class="q">${fmt(i.q)}</td></tr>`).join("")
      +subs.map(x=>`<tr class="grp"><td>${x.g}</td><td class="q">${fmt(x.items.reduce((a,b)=>a+b.q,0))}</td></tr>`+x.items.map(y=>`<tr class="sub ${y.k||""}"><td>${y.n}</td><td class="q">${fmt(y.q)}</td></tr>`).join("")).join("");
    const split=g.map(id=>{const t=flat(R[id].items).reduce((s,i)=>s+i.q,0)*pr[id].q;return `<tr class="sub"><td>${R[id].name} × ${num(pr[id].q)}</td><td class="q">${fmt(t)}</td></tr>`;}).join("");
    return `<details class="card" open><summary><b>${g.map(id=>R[id].name+" × "+num(pr[id].q)).join(" + ")}</b><span>${fmt(tot)}</span></summary><table>${rows}<tr class="tot"><td>Pâte totale</td><td class="q">${fmt(tot)}</td></tr><tr class="grp"><td>Division</td><td></td></tr>${split}<tr class="sub"><td>Hydratation de la pâte commune</td><td class="q">${Math.round(water/flour*100)} %</td></tr></table></details>`;};
  Pz.innerHTML=groups.map(groupCard).join("")+order.filter(id=>!grouped.includes(id)).map(id=>{const r=R[id],n=pr[id].q;let tot=0;
    const rows=r.items.map(i=>{
      if(i.g){const sub=i.items.reduce((s,x)=>s+x.q,0)*n;tot+=sub;
        return `<tr class="grp"><td>${i.g}</td><td class="q">${fmt(sub)}</td></tr>`+i.items.map(x=>`<tr class="sub ${x.k||""}"><td>${x.n}</td><td class="q">${fmt(x.q*n)}</td></tr>`).join("");}
      tot+=i.q*n;return `<tr class="${i.k||""}"><td>${i.n}</td><td class="q">${fmt(i.q*n)}</td></tr>`;}).join("");
    return `<details class="card" open><summary><b>${r.name} × ${num(n)}</b><span>${fmt(tot)}</span></summary><table>${rows}<tr class="tot"><td>Pâte totale</td><td class="q">${fmt(tot)}</td></tr></table></details>`;}).join("");
  const sumF=Object.values(fl).reduce((a,b)=>a+b,0);
  const lf=Object.entries(lv).filter(([k,v])=>v>0&&LV[k]).map(([k,v])=>[LV[k].flour,v*LV[k].f]);
  const sumL=lf.reduce((a,b)=>a+b[1],0);
  const line=([k,v])=>`<tr class="farine"><td>${k}<small>${(v/25*100).toFixed(0)} % d'un sac de 25 kg</small></td><td class="q">${fmt(v)}</td></tr>`;
  F.innerHTML=`<div class="flours"><table>`+Object.entries(fl).sort((a,b)=>b[1]-a[1]).map(line).join("")+`<tr class="tot"><td>Farines des pâtes</td><td class="q">${fmt(sumF)}</td></tr>`
    +lf.map(line).join("")+`<tr class="tot"><td>Farines des levains</td><td class="q">${fmt(sumL)}</td></tr><tr class="tot"><td>Total farines du jour</td><td class="q">${fmt(sumF+sumL)}</td></tr></table></div>`;
}
function render(){renderHead();if(tab==="V")renderSales();else if(tab==="O")renderPro();else renderProd();}
document.getElementById("tabV").onclick=()=>{tab="V";save();render();};
document.getElementById("tabO").onclick=()=>{tab="O";save();render();};
document.getElementById("resetO").onclick=()=>{const c=cur();delete c.mod[dateOf(oday)];delete c.w[dateOf(oday)];save();render();};
document.getElementById("saveType").onclick=()=>{const c=cur(),date=dateOf(oday);if(!confirm(`Ces quantités deviendront la commande type de ${c.name} chaque ${DAYNAMES[oday]}. Continuer ?`))return;const t={};cIds(c,date).forEach(id=>{const v=cq(c,date,id);if(v)t[id]=v;});c.type[oday]=t;delete c.mod[date];save();render();};
const closeNew=()=>{document.getElementById("newc").hidden=true;};
document.getElementById("newCancel").onclick=closeNew;
const okNew=()=>{const n=document.getElementById("newName").value.trim();if(!n)return;const f=document.getElementById("newc");
  if(f.dataset.mode==="rename"){cur().name=n;}else{const c={id:"c"+Date.now(),name:n,start:tuesdayOf(new Date()),type:{},mod:{},w:{}};clients.push(c);cid=c.id;}
  closeNew();save();render();};
document.getElementById("newOk").onclick=okNew;
document.getElementById("newName").onkeydown=e=>{if(e.key==="Enter")okNew();};
document.getElementById("renameC").onclick=()=>{const f=document.getElementById("newc");f.hidden=false;f.dataset.mode="rename";const i=document.getElementById("newName");i.value=cur().name;i.focus();};
document.getElementById("deleteC").onclick=()=>{const c=cur();if(!confirm(`Supprimer ${c.name} et toutes ses commandes ?`))return;clients=clients.filter(x=>x!==c);cid=clients[0]&&clients[0].id;save();render();};
document.getElementById("proAddBtn").onclick=()=>{const v=document.getElementById("proAdd").value;if(!v)return;const c=cur(),date=dateOf(oday);(c.mod[date]=c.mod[date]||{})[v]=1;save();render();};
document.getElementById("wPrev").onclick=()=>{wk=addDays(wk,-7);mo=null;render();};
document.getElementById("wNext").onclick=()=>{wk=addDays(wk,7);mo=null;render();};
const shiftMo=k=>{let [y,m]=mo.split("-").map(Number);m+=k;if(m<1){m=12;y--;}if(m>12){m=1;y++;}mo=y+"-"+String(m).padStart(2,"0");renderRecap(cur());};
document.getElementById("mPrev").onclick=()=>shiftMo(-1);document.getElementById("mNext").onclick=()=>shiftMo(1);
document.getElementById("tabP").onclick=()=>{tab="P";save();render();};
document.getElementById("resetV").onclick=()=>{sales[sday]={};save();render();};
document.getElementById("resetP").onclick=()=>{extras[pday]={};save();render();};
document.getElementById("addBtn").onclick=()=>{const v=document.getElementById("extra").value;if(!v)return;(extras[pday]=extras[pday]||{})[v]=1;save();render();};
document.getElementById("csvBtn").onclick=exportRecap;document.getElementById("exportBtn").onclick=exportAll;
render();setSync("local");initSync();initDownloads();
</script>
